[project]
name = "next-fastapi-monorepo-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.19.1",
  "fastapi>=0.124.2",
  "psycopg[binary]>=3.3.4",
  "sqlalchemy[asyncio]>=2.0.52",
  "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "python-dotenv>=1.2.1",
]

[tool.vercel.scripts]
build = "uv run alembic upgrade head"
